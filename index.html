</style></head><body>
<div id="lg" style="display:none"><div class="lgc"><img src="icon-192.png" alt=""><h1>Rumah Kita</h1><p class="sub">Log masuk untuk kami berdua</p><input id="le" type="email" placeholder="E-mel" autocomplete="username"><input id="lp" type="password" placeholder="Kata laluan" autocomplete="current-password"><button class="btn" id="lb">Log masuk</button><div id="lm" class="sub"></div></div></div>
<div id="sp"><img id="spi" alt="" src="icon-192.png"><b>Rumah Kita</b><small>Kita, setiap hari 💗</small></div>
<header><h1>💗 Rumah Kita</h1><p id="who">Pengurusan rumah tangga keluarga</p></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="cbar"><input id="ci" placeholder="Mesej" enterkeyhint="send" autocomplete="off"><button id="cs" aria-label="Hantar">&#10148;</button></div><button id="menub" aria-label="Menu">&#9776;</button><div id="dbk"></div><aside id="dp"></aside>

<script>
const TABS=[["utama","💑","Utama"],["chat","💬","Chat"],["dapur","🛒","Dapur"],["tugas","🧹","Tugasan"],["bil","🧾","Bil"],["belanja","💰","Belanja"],["kewangan","📊","Kewangan"],["simpan","🤑","Simpanan"],["wish","✨","Wishlist"],["qr","🏦","QR Bank"],["memori","📸","Memori"],["setting","⚙️","Setting"]];
let tab="utama",names={},items=[],budget=0,db=null,assets=null,me="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rm=n=>"RM"+(+n||0).toFixed(2);
const ofType=t=>items.filter(i=>i.type===t);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ready=()=>!!db;

async function save(o){
  if(!db){alert("Sambungan keluarga belum sedia. Cuba lagi sebentar.");return}
  const id=o.id||uid();
  try{await db.collection("items").doc(id).set({...o,id,by:me,ts:o.ts||Date.now()})}catch(e){toast("Gagal simpan: "+(e.message||e.code||""))}
}
async function upd(id,d){try{await db.collection("items").doc(id).update(d)}catch(e){toast("Gagal kemaskini")}}
async function del(id){try{await db.collection("items").doc(id).delete()}catch(e){alert("Gagal padam")}}
window.save=save;window.upd=upd;window.del=del;

function nav(){
  $("#nav").innerHTML=NT.map(t=>`<button class="${(t[0]===tab||(t[0]==="lagi"&&MORE.includes(tab)))?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${esc(names[t[0]]||t[2])}</button>`).join("");
}
window.go=t=>{tab=t;fresh=true;document.body.classList.remove('dopen');nav();render();if(t!=='chat')window.scrollTo(0,0)};

function addRow(ph,extra,fn){
  return `<div class="card row"><input id="a1" placeholder="${ph}">${extra||""}<button class="btn" onclick="${fn}">Tambah</button></div>`;
}
function list(arr,fmt){
  return arr.length?`<div class="card">${arr.map(fmt).join("")}</div>`:`<div class="empty">Belum ada apa-apa lagi.</div>`;
}
const delBtn=i=>`<button class="x" onclick="del('${i.id}')" aria-label="Padam">✕</button>`;

function render(){
  const m=$("#m");let h="";
  if(tab==="dapur"){
    const a=ofType("dapur").sort((x,y)=>x.done-y.done||y.ts-x.ts);
    h=addRow("Cth: Telur, susu, beras","","addDapur()")+list(a,i=>`<div class="item ${i.done?"done":""}"><input type="checkbox" ${i.done?"checked":""} onchange="upd('${i.id}',{done:this.checked})"><div class="t">${esc(i.name)}</div>${delBtn(i)}</div>`);
    if(a.some(i=>i.done))h+=`<button class="btn" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="clearDone()">Buang yang sudah dibeli</button>`;
  }
  if(tab==="tugas"){
    const a=ofType("tugas").sort((x,y)=>x.done-y.done||y.ts-x.ts);
    h=addRow("Cth: Sapu lantai","<input id=\"a2\" placeholder=\"Siapa?\" style=\"max-width:90px\">","addTugas()")+list(a,i=>`<div class="item ${i.done?"done":""}"><input type="checkbox" ${i.done?"checked":""} onchange="upd('${i.id}',{done:this.checked})"><div class="t">${esc(i.name)}<div class="sub">${i.who?"👤 "+esc(i.who):"Belum ditetapkan"}</div></div>${delBtn(i)}</div>`);
  }
  if(tab==="bil"){
    const a=allBils().sort((x,y)=>(x.paid-y.paid)||(x.due||"").localeCompare(y.due||""));
    const today=new Date().toISOString().slice(0,10);
    h=addRow("Cth: Bil elektrik","<input id=\"a2\" type=\"number\" inputmode=\"decimal\" placeholder=\"RM\" style=\"max-width:80px\"><input id=\"a3\" type=\"date\" style=\"max-width:140px\">","addBil()")+list(a,i=>{const late=!i.paid&&i.due&&i.due<today;return `<div class="item ${i.paid?"done":""}"><input type="checkbox" ${i.paid?"checked":""} onchange="payBil('${i.id}',this.checked)"><div class="t">${esc(i.name)} · ${rm(i.amt)}<div class="sub ${late?"bad":""}">${i.due?(late?"Lewat! ":"Tarikh: ")+esc(i.due):"Tiada tarikh"}${i.id.startsWith("car-")?" · berulang":""}</div></div>${i.id.startsWith("car-")?"":delBtn(i)}</div>`});
  }
  if(tab==="belanja"){
    const mo=new Date().toISOString().slice(0,7);
    const a=ofType("belanja").filter(i=>(i.date||"").startsWith(mo)).sort((x,y)=>(y.date||"").localeCompare(x.date||""));
    const tot=a.reduce((s,i)=>s+(+i.amt||0),0),p=budget?Math.min(100,tot/budget*100):0;

function fsShow(){
  let o=document.getElementById('fs');
  if(!fsL.length){if(o)o.remove();document.body.style.overflow='';return}
  if(!o){o=document.createElement('div');o.id='fs';document.body.appendChild(o);let sx=0;
    o.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    o.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&fsL.length>1)fsGo(dx<0?1:-1)},{passive:true})}
  const x=fsL[fsI],bt='position:absolute;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer';
  o.style.cssText='position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:'+(x.qr?'#fff':'#000');
  o.innerHTML=((x.ct||'').startsWith('video')?`<video src='${x.url}' controls autoplay playsinline style='max-width:100%;max-height:100%'></video>`:`<img src='${x.url}' alt='' style='max-width:100%;max-height:100%;object-fit:contain'>`)
  +`<button style='${bt};top:calc(env(safe-area-inset-top,0px) + 12px);right:12px' onclick='fsClose()' aria-label='Tutup'>✕</button>`
  +(fsL.length>1?`<button style='${bt};left:8px;top:50%' onclick='fsGo(-1)'>‹</button><button style='${bt};right:8px;top:50%' onclick='fsGo(1)'>›</button>`:'')
  +((x.cap||x.name)?`<div style='position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);text-align:center;pointer-events:none;color:${x.qr?'#000':'#fff'};text-shadow:0 1px 3px rgba(0,0,0,.4)'>${esc(x.cap||x.name)}</div>`:'');
  document.body.style.overflow='hidden';
}

const PAL={sky:["Langit","#3b6fe0","#fff","#eaf3ff","#8db4ff","#0a1633","#0d1322"],mauve:["Lavender","#7c5cf0","#fff","#f5f2ff","#b4a4ff","#17103a","#14111f"],peach:["Peach","#e8685a","#fff","#fff4f0","#ff9a8b","#2a0c08","#1a1312"],sage:["Sage","#4f8a6b","#fff","#f2f7f3","#8fd1ac","#0d2318","#121815"],teal:["Teal","#0f766e","#fff","#faf7f2","#2dd4bf","#0b1f1c","#1b1a18"],rose:["Jambu","#be185d","#fff","#fff5f7","#f472b6","#2a0f1b","#1f1619"],biru:["Biru","#1d4ed8","#fff","#f3f7ff","#60a5fa","#0b1a33","#161a21"],ungu:["Ungu","#6d28d9","#fff","#f8f5ff","#a78bfa","#1a0f33","#1a1721"],jingga:["Jingga","#c2410c","#fff","#fff7f0","#fb923c","#2b1304","#201a15"],coklat:["Coklat","#78350f","#fff","#faf5ee","#d6a36b","#2a1a08","#1d1a16"]};

function applyTheme(){
  const p=PAL[theme.c]||PAL.sky,mode=theme.m||"auto",dark=mode==="dark"||(mode==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);
  const r=document.documentElement,s=r.style,sh=SH[theme.s]||SH.bulat;
  mode==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",mode);
  s.setProperty("--ac",dark?p[4]:p[1]);s.setProperty("--acx",dark?p[5]:p[2]);s.setProperty("--bg",dark?p[6]:p[3]);

}

let SB=null;const BK='media',SIGN={},LS=[];
async function signPaths(paths){
  const need=[...new Set(paths)].filter(p=>!SIGN[p]||SIGN[p].exp<Date.now());
  if(need.length){const {data}=await SB.storage.from(BK).createSignedUrls(need,604800);(data||[]).forEach(x=>{if(x.signedUrl)SIGN[x.path]={u:x.signedUrl,exp:Date.now()+6*864e5}})}
}
const UK=['url','pa','pb'];
const pathsOf=d=>d?UK.map(k=>d[k]).filter(v=>typeof v==='string'&&v.startsWith('sb:')).map(v=>v.slice(3)):[];
function fixDoc(d){if(!d)return d;const o={...d};UK.forEach(k=>{if(typeof o[k]==='string'&&o[k].startsWith('sb:')){const e=SIGN[o[k].slice(3)];o[k]=e?e.u:''}});return o}
function makeDB(){
  let n=0;
  const live=(t,fn)=>{LS.push({t,fn});fn();SB.channel('c'+(++n)+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>fn()).subscribe()};
  const poke=t=>LS.filter(x=>x.t===t).forEach(x=>x.fn());
  const now=()=>new Date().toISOString();
  return {collection:t=>({
    doc:id=>({
      async set(d){const {error}=await SB.from(t).upsert({id,data:d,updated_at:now()});if(error)throw error;poke(t)},
      async update(d){const {data:r}=await SB.from(t).select('data').eq('id',id).maybeSingle();const {error}=await SB.from(t).upsert({id,data:{...(r?r.data:{}),...d},updated_at:now()});if(error)throw error;poke(t)},
      async delete(){const {error}=await SB.from(t).delete().eq('id',id);if(error)throw error;poke(t)},
      onSnapshot(cb,er){live(t,async()=>{try{const {data:r,error}=await SB.from(t).select('data').eq('id',id).maybeSingle();if(error)throw error;const raw=r?r.data:undefined;await signPaths(pathsOf(raw));const d=fixDoc(raw);cb({data:()=>d})}catch(e){er&&er(e)}})}
    }),
    onSnapshot(cb,er){live(t,async()=>{try{const {data:r,error}=await SB.from(t).select('id,data');if(error)throw error;const rows=r||[];await signPaths(rows.flatMap(x=>pathsOf(x.data)));cb({docs:rows.map(x=>{const d=fixDoc(x.data);return {data:()=>d}})})}catch(e){er&&er(e)}})}
  })}
}

  $('#lb').onclick=go;$('#lp').onkeydown=ev=>{if(ev.key==='Enter')go()};
})}

(async()=>{
  try{
    if(!window.supabase||!window.CFG||!CFG.url||CFG.url.includes('PASTE')){render();toast('Sila isi config.js dengan URL dan kunci Supabase.');return}
    SB=supabase.createClient(CFG.url,CFG.key);

    assets={async upload(f){const ext=((f.name||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin',path=crypto.randomUUID()+'.'+ext;const {error}=await SB.storage.from(BK).upload(path,f,{contentType:f.type||undefined});if(error)throw error;return {url:'sb:'+path,id:path}}};
    db=makeDB();

    db.collection("settings").doc("theme").onSnapshot(s=>{theme=s.data()||{};applyTheme();if(tab==="setting"&&!document.activeElement?.classList.contains("tn"))render()},()=>{});
    db.collection("settings").doc("tabs").onSnapshot(s=>{names=s.data()||{};nav();if(tab==="setting"&&!document.activeElement?.classList.contains("tn"))render()},()=>{});
    db.collection("settings").doc("budget").onSnapshot(s=>{budget=(s.data()||{}).amt||0;if(tab==="belanja")render()},()=>{});
    render();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){toast('Ralat: '+(e.message||e))}
})();
